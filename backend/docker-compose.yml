services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: rendez_vous_sqlserver
    restart: always
    user: "0:0"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=TryurBestToNotGetHacked123!
      - MSSQL_PID=Developer
    ports:
      - "14333:1433"
    volumes:
      - mssql_data:/var/opt/mssql/data

volumes:
  mssql_data:
